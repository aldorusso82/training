<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TRAIN.BEYOND</title>
  <meta name="theme-color" content="#8b1a1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TRAIN.BEYOND">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="brand"><svg class="home-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg><span class="bn">TRAIN<span>.</span>BEYOND<em class="bt">ORDINARY<br>WORKOUT</em></span></div>
    <div class="idrow"><div class="athlete" id="athlete" hidden></div><img class="bowlogo" src="img/bow-logo.png" alt="BOW · Beyond Ordinary Workout"></div>
    <div class="top-row">
      <button class="plan-btn" id="planBtn" aria-label="Cambia scheda di lavoro"><span class="plan-lbl">Scheda di lavoro</span> <span id="planName">…</span> <span class="plan-caret">▾</span></button>
      <button class="diary-btn" id="diaryBtn">Diary</button>
    </div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
  </header>

  <main id="main" class="main">
    <p class="loading">Caricamento…</p>
  </main>

  <footer class="foot">
    <p>Foto esercizi: <a href="https://github.com/yuhonas/free-exercise-db" target="_blank" rel="noopener">free-exercise-db</a> di yuhonas, rilasciate in pubblico dominio (The Unlicense). Video: YouTube, dei rispettivi autori.</p>
    <p id="version" class="ver"></p>
  </footer>

  <button class="music-fab" id="musicFab" aria-label="Musica">🎵</button>

  <nav class="bnav" aria-label="Navigazione">
    <button id="navPlan"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 9h6M9 13h6M9 17h4"/></svg>Plan</button>
    <button id="navDrills"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3v18M5.500 5.500c3 3 3 10 0 13M18.500 5.500c-3 3-3 10 0 13"/></svg>Practice</button>
    <button id="navFood"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7c-2-2-6-1-6 4 0 4 3 9 6 9s6-5 6-9c0-5-4-6-6-4zM12 7c0-2 1-3 3-3"/></svg>Nutrition</button>
    <button id="navRehab"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.500-7 10-7 10z"/><path d="M7 12h3l1.500-2.500L13 14l1-2h3"/></svg>Rehab</button>
    <button id="navDiary"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Diary</button>
  </nav>

  <!-- Scheda esercizio -->
  <div class="sheet" id="sheet" hidden>
    <div class="sheet-bar">
      <button class="btn-close" id="sheetClose" aria-label="Chiudi">✕</button>
      <div class="sheet-title" id="sheetTitle"></div>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>

  <!-- Timer recupero -->
  <div class="overlay" id="timer" hidden>
    <div class="t-label" id="tLabel">Recupero</div>
    <div class="ring-wrap">
      <svg class="ring" viewBox="0 0 200 200" aria-hidden="true">
        <circle class="ring-bg" cx="100" cy="100" r="88"/>
        <circle class="ring-fg" id="ringFg" cx="100" cy="100" r="88"/>
      </svg>
      <div class="t-num" id="tNum">0:00</div>
    </div>
    <div class="t-actions">
      <button class="btn-ghost" id="tMinus">−15''</button>
      <button class="btn-ghost" id="tPlus">+15''</button>
    </div>
    <button class="btn-big btn-light" id="tStop">Chiudi</button>
    <button class="btn-ghost t-min" id="tMin">▾ Riduci a banner</button>
  </div>

  <!-- Timer ridotto a banner -->
  <div class="t-bar" id="tBar" hidden>
    <div class="t-bar-txt"><span id="tBarLbl">Recupero</span><b id="tBarNum">0:00</b></div>
    <button id="tBarOpen" aria-label="Apri il timer">▴ Apri</button>
    <button id="tBarClose" aria-label="Chiudi il timer">✕</button>
  </div>

  <!-- Timer intervalli -->
  <div class="overlay iv" id="ivTimer" hidden>
    <div class="iv-step" id="ivStep"></div>
    <img class="iv-img" id="ivImg" alt="" hidden>
    <div class="iv-phase" id="ivPhase">CORSA</div>
    <div class="t-num iv-num" id="ivNum">0:00</div>
    <div class="iv-next" id="ivNext"></div>
    <div class="iv-bar"><div class="iv-fill" id="ivFill"></div></div>
    <div class="iv-total" id="ivTotal"></div>
    <div class="t-actions">
      <button class="btn-ghost" id="ivPause">Pausa</button>
      <button class="btn-ghost" id="ivSkip">Salta ›</button>
    </div>
    <button class="btn-big btn-light" id="ivStop">Termina</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
